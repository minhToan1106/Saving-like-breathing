<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rules Check</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f6f1e6; color: #2a1f16; }
    li { margin: 4px 0; }
    .pass { color: #3d6b2a; }
    .fail { color: #a32a1c; font-weight: bold; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Rules check</h1>
  <p>Runs the PRD examples against <code>js/rules.js</code>. A development aid, not part of the app.</p>
  <p id="summary"></p>
  <ul id="results"></ul>

  <script src="js/dates.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/catchup.js"></script>
  <script>
    (function () {
      var R = BY.rules, D = BY.dates;
      var results = [];

      function check(name, actual, expected) {
        var ok = JSON.stringify(actual) === JSON.stringify(expected);
        results.push({ name: name, ok: ok, actual: actual, expected: expected });
      }

      function dataWith(entries) {
        return { days: {}, diary: { startingBalances: {}, entries: entries } };
      }

      // ---- Verdict (prd.md > Night Check-in and Verdict) ----
      var a = R.settleDay(5000, 10000, 13000, 300);
      check('Morning $50 + income $100 − night $130 = $20 spent', a.actualSpent, 2000);
      check('… at a $3 limit → Lose', a.result, 'loss');
      check('… a loss saves nothing', a.saved, 0);

      var b = R.settleDay(5000, 0, 4800, 300);
      check('Morning $50 − night $48 = $2 spent', b.actualSpent, 200);
      check('… at a $3 limit → Win', b.result, 'win');
      check('… saves the unspent $1', b.saved, 100);

      check('Spending exactly the limit is a win', R.settleDay(5000, 0, 4700, 300).result, 'win');
      check('Higher night balance with no income counts as $0 spent', R.settleDay(5000, 0, 5200, 300).actualSpent, 0);
      check('… and is a win', R.settleDay(5000, 0, 5200, 300).result, 'win');

      // ---- Limits (prd.md > Morning Bet, States and Boundaries) ----
      check('$3 tap after a loss → $2.50 limit', R.limitFor(300, 50), 250);
      check('$0.50 custom bet with a penalty → $0 limit', R.limitFor(50, 50), 0);
      check('No penalty keeps the stake', R.limitFor(1000, 0), 1000);

      // ---- Income from the diary ----
      var diary = dataWith([
        { date: '2026-10-04', type: 'income', amount: 10000 },
        { date: '2026-10-04', type: 'spending', amount: 400 },
        { date: '2026-10-03', type: 'income', amount: 2500 },
        { date: '2026-10-04', type: 'income', amount: 150 }
      ]);
      check('Income today sums only today\'s income entries', R.incomeOn(diary, '2026-10-04'), 10150);
      check('No entries → $0 income', R.incomeOn(dataWith([]), '2026-10-04'), 0);

      // ---- Money input ----
      check('"48.50" → 4850 cents', R.parseMoney('48.50'), 4850);
      check('"$3" → 300 cents', R.parseMoney('$3'), 300);
      check('" 0.1 " → 10 cents', R.parseMoney(' 0.1 '), 10);
      check('"" is invalid', R.parseMoney(''), null);
      check('"abc" is invalid', R.parseMoney('abc'), null);
      check('"-5" is invalid', R.parseMoney('-5'), null);
      check('"4.505" is invalid', R.parseMoney('4.505'), null);
      check('250 cents shows as $2.50', R.formatMoney(250), '$2.50');

      // ---- Dates ----
      check('Day after Oct 31 is Nov 1', D.addDays('2026-10-31', 1), '2026-11-01');
      check('Day before Mar 1 is Feb 28', D.addDays('2026-03-01', -1), '2026-02-28');
      check('Night is closed at 6:59 PM', D.isNightOpen(new Date(2026, 9, 4, 18, 59)), false);
      check('Night opens at 7:00 PM', D.isNightOpen(new Date(2026, 9, 4, 19, 0)), true);
      check('Month key', D.monthKey(new Date(2026, 9, 4)), '2026-10');

      // ---- Penalty (prd.md > Morning Bet) ----
      function day(result) { return { stake: 300, penalty: 0, limit: 300, result: result }; }
      check('Day after a loss → $0.50 penalty', R.penaltyFor({ days: { '2026-10-03': day('loss') } }, '2026-10-04'), 50);
      check('Day after a win → no penalty', R.penaltyFor({ days: { '2026-10-03': day('win') } }, '2026-10-04'), 0);
      check('First day of use → no penalty', R.penaltyFor({ days: {} }, '2026-10-04'), 0);
      check('Two losses in a row → still a flat $0.50', R.penaltyFor({ days: { '2026-10-02': day('loss'), '2026-10-03': day('loss') } }, '2026-10-04'), 50);

      // ---- Streak (prd.md > Streaks and Achievements) ----
      check('No days → streak 0', R.currentStreak({ days: {} }), 0);
      check('Three wins in a row → streak 3', R.currentStreak({ days: {
        '2026-10-01': day('win'), '2026-10-02': day('win'), '2026-10-03': day('win') } }), 3);
      check('A loss resets the streak to 0', R.currentStreak({ days: {
        '2026-10-01': day('win'), '2026-10-02': day('win'), '2026-10-03': day('loss') } }), 0);
      check('Wins after a loss count from the loss', R.currentStreak({ days: {
        '2026-10-01': day('win'), '2026-10-02': day('loss'), '2026-10-03': day('win'), '2026-10-04': day('win') } }), 2);
      check('Today still open → streak counts up to yesterday', R.currentStreak({ days: {
        '2026-10-02': day('win'), '2026-10-03': day('win'), '2026-10-04': day(null) } }), 2);
      check('A win earns the small achievement', R.achievementsFor({ days: { '2026-10-04': day('win') } }, '2026-10-04'), ['win']);
      check('A loss earns nothing', R.achievementsFor({ days: { '2026-10-04': day('loss') } }, '2026-10-04'), []);

      // ---- Missed check-ins (catch-up on open) ----
      var missed = { startDate: '2026-10-01', days: {
        '2026-10-01': day('win'),
        '2026-10-02': { stake: 300, penalty: 0, limit: 300, morningBalance: 5000, result: null } } };
      var changed = BY.catchup.run(missed, new Date(2026, 9, 4, 9, 0));
      check('Catch-up reports a change', changed, true);
      check('Bet placed but never settled → loss', [missed.days['2026-10-02'].result, missed.days['2026-10-02'].missed], ['loss', true]);
      check('No bet at all → loss', [missed.days['2026-10-03'].result, missed.days['2026-10-03'].missed], ['loss', true]);
      check('Today is left open', missed.days['2026-10-04'], undefined);
      check('Earlier win is untouched', missed.days['2026-10-01'].result, 'win');
      check('A missed day breaks the streak', R.currentStreak(missed), 0);
      check('The morning after a missed day has a penalty', R.penaltyFor(missed, '2026-10-04'), 50);
      check('Running catch-up again changes nothing', BY.catchup.run(missed, new Date(2026, 9, 4, 9, 0)), false);
      var acrossMonth = { startDate: '2026-09-29', days: {} };
      BY.catchup.run(acrossMonth, new Date(2026, 9, 2, 9, 0));
      check('Catch-up crosses a month boundary', Object.keys(acrossMonth.days).sort(), ['2026-09-29', '2026-09-30', '2026-10-01']);

      // ---- One balance: the bet starts from the Diary balance (prd.md > Morning Bet) ----
      var BET = 1000000; // a fake "bet locked in" time
      var inc = dataWith([
        { date: '2026-10-04', type: 'income', amount: 10000, at: BET - 5 },
        { date: '2026-10-04', type: 'income', amount: 2000, at: BET + 5 },
        { date: '2026-10-04', type: 'spending', amount: 500, at: BET + 6 }
      ]);
      check('Income logged before the bet is not counted twice', R.incomeOn(inc, '2026-10-04', BET), 2000);
      check('Without a bet time, all of the day\'s income counts', R.incomeOn(inc, '2026-10-04'), 12000);

      // Example from the team: Diary $100, $5 coffee before the bet, $5 lunch after
      var ex = dataWith([
        { date: '2026-10-04', type: 'spending', amount: 500, at: BET - 5 },
        { date: '2026-10-04', type: 'spending', amount: 500, at: BET + 5 }
      ]);
      ex.diary.startingBalances['2026-10'] = 10000;
      var exOut = R.settleDay(9500, R.incomeOn(ex, '2026-10-04', BET), 9000, 300);
      check('Coffee before the bet → morning $95; lunch after → $5 spent', exOut.actualSpent, 500);
      check('… Lose at a $3 limit', exOut.result, 'loss');

      // ---- Unlogged spending at settle ----
      check('Night lower than the Diary → unlogged spending for the difference',
        R.unloggedSpending(9000, 8400), { type: 'spending', amount: 600, note: 'Unlogged spending' });
      check('Night matches the Diary → nothing added', R.unloggedSpending(9000, 9000), null);
      check('Night higher than the Diary → nothing added', R.unloggedSpending(9000, 9500), null);

      // ---- New month suggestion ----
      check('Month before January is December', D.prevMonth('2026-01'), '2025-12');
      var nm = dataWith([
        { date: '2026-09-10', type: 'spending', amount: 2000 },
        { date: '2026-09-20', type: 'income', amount: 500 }
      ]);
      nm.diary.startingBalances['2026-09'] = 20000;
      check('New month suggests where last month ended', R.monthStartSuggestion(nm, '2026-10'), 18500);
      check('No last month → no suggestion', R.monthStartSuggestion(nm, '2026-09'), null);

      // ---- Diary balance per month (prd.md > Diary) ----
      var md = dataWith([
        { date: '2026-09-30', type: 'spending', amount: 999 },
        { date: '2026-10-01', type: 'spending', amount: 400 },
        { date: '2026-10-02', type: 'income', amount: 10000 }
      ]);
      check('No starting money this month → asks (null)', R.monthBalance(md, '2026-10'), null);
      md.diary.startingBalances['2026-10'] = 20000;
      check("Balance = this month's start + income − spending", R.monthBalance(md, '2026-10'), 29600);
      check("Last month's starting money doesn't answer this month", R.monthBalance({ diary: { startingBalances: { '2026-09': 5000 }, entries: [] } }, '2026-10'), null);

      // ---- Show results ----
      var list = document.getElementById('results');
      var failed = 0;
      results.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = (r.ok ? 'PASS  ' : 'FAIL  ') + r.name +
          (r.ok ? '' : '  (got ' + JSON.stringify(r.actual) + ', expected ' + JSON.stringify(r.expected) + ')');
        list.appendChild(li);
        if (!r.ok) failed++;
      });
      var summary = document.getElementById('summary');
      summary.textContent = (results.length - failed) + ' passed, ' + failed + ' failed';
      summary.className = failed ? 'fail' : 'pass';
      summary.dataset.passed = results.length - failed;
      summary.dataset.failed = failed;
    })();
  </script>
</body>
</html>
